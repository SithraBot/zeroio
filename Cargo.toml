[workspace]
resolver = "3"
members = ["crates/*"]
default-members = []

[workspace.package]
edition = "2024"

[workspace.dependencies]

# Workspace member crates

# External crates
serde = { version = "1.0", features = ["derive"] }
rmp-serde = "1.3"
thiserror = "2.0"

[profile.dev]
split-debuginfo = "unpacked"
debug = "limited"
codegen-units = 16

[profile.release]
debug = "limited"
lto = "thin"
panic = "abort"
strip = true
codegen-units = 1
opt-level = 3
