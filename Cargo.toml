[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]

# Workspace member crates

fleximq-protocol = { path = "crates/protocol" }
fleximq-transport = { path = "crates/transport" }

# External crates
once_cell = "1"
serde = { version = "1.0", features = ["derive"] }
rmp-serde = { version = "1.3" }
rmpv = { version = "1.3", features = ["with-serde"] }
thiserror = "2.0"
bytes = "1.10"
async-trait = "0.1"
ulid = "1.2"
dashmap = "6.1"
log = "0.4"
lru = "0.14"
url = "2.5"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1.45", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "compat"] }
nom = { version = "8", features = ["alloc"] }
futures-util = { version = "0.3", default-features = false, features = [
    "sink",
    "std",
] }

[workspace.lints.clippy]
# Performance lints - important for a communication library
expect_used = "warn"
unwrap_used = "warn"
panic = "warn"
clone_on_ref_ptr = "warn"
rc_buffer = "warn"
rc_mutex = "warn"

# Memory and allocation
box_collection = "warn"
vec_init_then_push = "warn"
large_stack_arrays = "warn"
large_const_arrays = "warn"
large_enum_variant = "warn"

# API design
must_use_candidate = "warn"
return_self_not_must_use = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"

# Error handling
result_large_err = "warn"
redundant_clone = "warn"
unnecessary_wraps = "warn"

# Code quality
cognitive_complexity = "warn"
too_many_lines = "warn"
similar_names = "warn"
single_match_else = "warn"
option_if_let_else = "warn"

# Pedantic lints that make sense for a library
explicit_iter_loop = "warn"
manual_let_else = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
unreadable_literal = "warn"
unused_self = "warn"

# Network/serialization specific
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"

# Allow some lints that might be too noisy
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"

[profile.dev]
split-debuginfo = "unpacked"
debug = "limited"
codegen-units = 16

[profile.release]
debug = "limited"
lto = "thin"
panic = "abort"
strip = true
codegen-units = 1
opt-level = 3
